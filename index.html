<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山手線 駅タイプ診断 - わたしたちさんぽだいすき®</title>
  <style>
    :root {
      --yamanote: #80C241;
      --yamanote-dark: #5c9927;
      --yamanote-light: #eaf6db;
      --text-main: #24292e;
      --text-sub: #57606a;
      --bg: #f7faf4;
      --card-bg: #ffffff;
      --border: #d0d7de;
      --shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* ヘッダー */
    header {
      background: #ffffff;
      border-bottom: 4px solid var(--yamanote);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .logo-img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #dcdcdc;
    }
    .logo-badge-fallback {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--yamanote);
      color: white;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.5px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* ナビゲーション */
    nav {
      display: flex;
      gap: 6px;
    }
    .nav-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active, .nav-btn:hover {
      background: var(--yamanote);
      border-color: var(--yamanote);
      color: #ffffff;
    }

    /* メインコンテナ */
    main {
      max-width: 840px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    /* タイトルセクション */
    .hero-banner {
      text-align: center;
      padding: 30px 16px;
      background: linear-gradient(135deg, #ffffff 0%, var(--yamanote-light) 100%);
      border: 2px solid var(--yamanote);
    }
    .hero-badge {
      display: inline-block;
      background: var(--yamanote);
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .hero-title {
      font-size: 26px;
      font-weight: 900;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .hero-desc {
      font-size: 14px;
      color: var(--text-sub);
      max-width: 600px;
      margin: 0 auto 20px auto;
    }

    /* ボタン */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--yamanote);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(128,194,65,0.3);
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--yamanote-dark);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #f1f3f5;
      color: var(--text-main);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #e4e7ea;
    }

    /* 診断エリア */
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-bar {
      height: 100%;
      background: var(--yamanote);
      width: 0%;
      transition: width 0.3s ease;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .q-axis-badge {
      font-size: 12px;
      background: var(--yamanote-light);
      color: var(--yamanote-dark);
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .q-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 24px;
      color: #1f2328;
    }
    .choices-grid {
      display: grid;
      gap: 14px;
    }
    .choice-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.15s ease;
      background: #ffffff;
    }
    .choice-card:hover {
      border-color: var(--yamanote);
      background: var(--yamanote-light);
      transform: translateX(4px);
    }
    .choice-track {
      background: #24292e;
      color: white;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* 駅名標UI風 結果表示 */
    .station-sign {
      background: #ffffff;
      border: 3px solid #24292e;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      position: relative;
      margin-bottom: 24px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    .sign-bar {
      height: 14px;
      background: var(--yamanote);
      border-radius: 7px;
      margin: 14px 0 20px 0;
      position: relative;
    }
    .sign-code {
      display: inline-block;
      background: #24292e;
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .sign-name {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #1f2328;
      line-height: 1.1;
    }
    .sign-ruby {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .sign-alias {
      display: inline-block;
      background: #fff3bf;
      color: #8c5800;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 15px;
      margin-top: 6px;
    }

    /* 結果詳細カード */
    .detail-section {
      margin-bottom: 16px;
    }
    .detail-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--yamanote-dark);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-body {
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
    }
    .axis-compare-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      margin-top: 18px;
    }
    .axis-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .axis-meter {
      flex: 1;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin: 0 12px;
      position: relative;
      overflow: hidden;
    }
    .axis-fill {
      height: 100%;
      background: var(--yamanote);
      position: absolute;
      top: 0;
    }

    /* サイコロとお題カード */
    .dice-playground {
      text-align: center;
    }
    .dice-visual-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }
    .dice-cube {
      width: 80px;
      height: 80px;
      background: #ffffff;
      border: 3px solid #24292e;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      box-shadow: 0 6px 0 #24292e;
      transition: transform 0.2s;
    }
    .dice-rolling {
      animation: diceShake 0.4s infinite;
    }
    @keyframes diceShake {
      0% { transform: rotate(0deg) scale(1.05); }
      25% { transform: rotate(10deg); }
      75% { transform: rotate(-10deg); }
      100% { transform: rotate(0deg) scale(1.05); }
    }

    /* お題カード */
    .card-topic-wrapper {
      margin-top: 30px;
      perspective: 1000px;
    }
    .topic-card {
      background: linear-gradient(145deg, #ffffff 0%, #f4fbf0 100%);
      border: 2px dashed var(--yamanote);
      border-radius: 16px;
      padding: 24px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 6px 16px rgba(128,194,65,0.12);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .topic-card.flipped {
      animation: cardFlip 0.5s ease;
    }
    @keyframes cardFlip {
      0% { transform: scale(0.9) rotateY(90deg); opacity: 0; }
      100% { transform: scale(1) rotateY(0deg); opacity: 1; }
    }
    .topic-cat-badge {
      display: inline-block;
      font-size: 11px;
      background: var(--yamanote);
      color: white;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .topic-text {
      font-size: 18px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1.5;
    }
    .topic-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 8px;
    }

    /* 相性シミュレーター＆図鑑 */
    .compat-picker {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .station-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid var(--border);
      font-size: 15px;
      font-weight: 700;
      background: white;
    }
    .compat-result-box {
      text-align: center;
      padding: 24px;
      background: #f8fafc;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
    }
    .compat-score {
      font-size: 54px;
      font-weight: 900;
      color: var(--yamanote-dark);
      line-height: 1;
    }
    .compat-rank {
      display: inline-block;
      background: #24292e;
      color: white;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 800;
      margin: 10px 0;
    }
    .compat-meet {
      background: white;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 14px;
    }

    /* ロゴ変更UI (簡易ポップアップ) */
    .logo-uploader-card {
      font-size: 12px;
      color: var(--text-sub);
      text-align: right;
      margin-top: -10px;
      margin-bottom: 12px;
    }
    .logo-uploader-card label {
      cursor: pointer;
      color: var(--yamanote-dark);
      text-decoration: underline;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .header-inner { flex-direction: column; align-items: stretch; }
      .compat-picker { grid-template-columns: 1fr; }
      .sign-name { font-size: 32px; }
      .nav-btn { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>

        <img id="headerLogoImg" class="logo-img" style="display:none;" alt="WSD Logo">
        <div id="headerLogoFallback" class="logo-badge-fallback">WSD</div>
        <div>
          <div class="brand-title">山手線 駅タイプ診断</div>
          <div class="brand-sub">わたしたちさんぽだいすき®</div>
        </div>
      </div>
      <nav>
        <button class="nav-btn active" onclick="switchTab('quiz')">診断する</button>
